<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>个人办公工作台</title>
<style>
  :root{
    --primary:#D97757;
    --primary-dark:#B85842;
    --primary-light:#FAF0E8;
    --accent:#C4634A;
    --bg:#FAF9F5;
    --card:#FFFFFF;
    --text:#1A1A1A;
    --muted:#6B6B6B;
    --border:#E8E5DD;
    --danger:#C8553D;
    --danger-bg:#FBF0EE;
    --warn:#D4914D;
    --warn-bg:#FBF5EE;
    --success:#4A7C59;
    --p0:#C8553D;
    --p1:#D97757;
    --p2:#B89968;
    --p3:#8B8276;
    --shadow:0 1px 3px rgba(120,80,40,.07),0 1px 2px rgba(120,80,40,.04);
    --shadow-lg:0 10px 30px rgba(120,80,40,.10);
    --radius:16px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--primary);outline-offset:1px;}

  /* ===== Header ===== */
  .app-header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:16px 24px;
    display:flex;
    align-items:center;
    gap:16px;
    position:sticky;top:0;z-index:50;
  }
  .header-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .header-logo svg{width:34px;height:34px;}
  .header-title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:.5px;font-family:Georgia,"Times New Roman","Songti SC",serif;}
  .header-sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .header-banner{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 18px;
    border-radius:12px;
    background:linear-gradient(100deg,#FBF5EE 0%,#FAF0E8 60%,#FAF0E8 100%);
    border:1px solid #E8C9B5;
    overflow:hidden;
  }
  .header-banner svg{width:90px;height:42px;flex-shrink:0;}
  .header-banner-text{font-size:12.5px;color:var(--primary-dark);line-height:1.45;min-width:0;}
  .header-banner-text b{color:var(--text);}
  .header-actions{display:flex;gap:8px;flex-shrink:0;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 14px;border-radius:var(--radius-sm);
    font-size:13.5px;font-weight:600;
    min-height:40px;
    transition:all .15s;
    border:1px solid transparent;
    white-space:nowrap;
  }
  .btn svg{width:15px;height:15px;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:var(--card);color:var(--text);border-color:var(--border);}
  .btn-ghost:hover{background:#f1f5f9;border-color:#cbd5e1;}
  .btn-danger{background:var(--card);color:var(--danger);border-color:#fecaca;}
  .btn-danger:hover{background:var(--danger-bg);}
  .btn-sm{padding:6px 10px;min-height:34px;font-size:12.5px;}
  .btn-icon{padding:0;width:36px;height:36px;min-height:36px;border-radius:8px;}
  .btn-icon svg{width:16px;height:16px;}

  /* ===== Layout ===== */
  .layout{display:flex;max-width:1320px;margin:0 auto;padding:18px;gap:18px;align-items:flex-start;}
  .sidebar{
    width:200px;flex-shrink:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:10px;
    position:sticky;top:88px;
    box-shadow:var(--shadow);
  }
  .nav-item{
    display:flex;align-items:center;gap:11px;
    width:100%;padding:11px 12px;
    border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);
    text-align:left;transition:all .15s;
    min-height:44px;
  }
  .nav-item:hover{background:#f1f5f9;color:var(--text);}
  .nav-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:600;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item .count-badge{
    margin-left:auto;background:var(--danger);color:#fff;
    font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;min-width:20px;text-align:center;
  }
  .nav-item.active .count-badge{background:var(--primary);}
  .main{flex:1;min-width:0;}

  /* ===== Top Alert (今天要处理) ===== */
  .top-alert{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;
    box-shadow:var(--shadow);
  }
  .top-alert-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;}
  .top-alert-title .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);}
  .top-alert.has-issue{border-color:#fecaca;background:linear-gradient(0deg,#fff 0%,#FBF5EE 100%);}
  .top-alert.has-issue .top-alert-title .dot{animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .top-alert-empty{font-size:13px;color:var(--success);display:flex;align-items:center;gap:8px;}
  .alert-list{display:flex;flex-direction:column;gap:8px;}
  .alert-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:10px;background:var(--danger-bg);
    border:1px solid #fecaca;font-size:13px;
  }
  .alert-item.warn{background:var(--warn-bg);border-color:#E8C9B5;}
  .alert-item-tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--danger);color:#fff;flex-shrink:0;}
  .alert-item.warn .alert-item-tag{background:var(--warn);}
  .alert-item-text{flex:1;min-width:0;color:var(--text);}
  .alert-item-text .sub{color:var(--muted);font-size:12px;}
  .alert-item-btn{font-size:12px;color:var(--primary-dark);font-weight:600;padding:4px 10px;border-radius:6px;background:#fff;border:1px solid var(--border);}
  .alert-item-btn:hover{background:var(--primary-light);}

  /* backup reminder */
  .backup-reminder{
    background:var(--warn-bg);border:1px solid #E8C9B5;border-radius:10px;
    padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:#92400e;
  }
  .backup-reminder svg{width:18px;height:18px;flex-shrink:0;}
  .backup-reminder .btn-sm{margin-left:auto;}

  /* ===== Sections ===== */
  .section{display:none;}
  .section.active{display:block;animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
  .section-head h2{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;font-family:Georgia,"Times New Roman","Songti SC",serif;}
  .section-head h2 svg{width:20px;height:20px;color:var(--primary);}
  .section-desc{font-size:12.5px;color:var(--muted);margin-top:2px;}

  /* ===== Card ===== */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .card + .card{margin-top:14px;}
  .card-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .card-title .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500;}

  /* ===== Form ===== */
  .form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;}
  .form-field{display:flex;flex-direction:column;gap:4px;}
  .form-field label{font-size:12px;color:var(--muted);font-weight:500;}
  .form-field input,.form-field select,.form-field textarea{
    padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;
    min-height:42px;
  }
  .form-field textarea{min-height:60px;resize:vertical;}
  .flex-1{flex:1;min-width:140px;}
  .flex-2{flex:2;min-width:200px;}

  /* ===== Todo ===== */
  .todo-group{margin-bottom:16px;}
  .todo-group-head{
    display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text);
    margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed var(--border);
  }
  .todo-group-head .gtag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
  .gtag-overdue{background:var(--danger);color:#fff;}
  .gtag-today{background:var(--primary);color:#fff;}
  .gtag-tomorrow{background:var(--accent);color:#fff;}
  .gtag-week{background:#EBDFC8;color:#8B6B3D;}
  .gtag-future{background:#EDEAE2;color:var(--text);}
  .todo-group-head .gcount{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px;}

  .todo-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
    background:#fff;border:1px solid var(--border);margin-bottom:7px;transition:all .15s;
  }
  .todo-item:hover{border-color:#cbd5e1;box-shadow:var(--shadow);}
  .todo-item.postponed{border-color:#E8C9B5;background:#FBF5EE;}
  .todo-item.done{opacity:.6;}
  .todo-item.done .todo-title{text-decoration:line-through;color:var(--muted);}

  .check-btn{
    width:22px;height:22px;border-radius:6px;border:2px solid #cbd5e1;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;
  }
  .check-btn:hover{border-color:var(--primary);}
  .todo-item.done .check-btn{background:var(--success);border-color:var(--success);}
  .check-btn svg{width:14px;height:14px;color:#fff;opacity:0;}
  .todo-item.done .check-btn svg{opacity:1;}

  .todo-main{flex:1;min-width:0;}
  .todo-title{font-size:14px;font-weight:500;color:var(--text);word-break:break-word;}
  .todo-meta{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap;}
  .pchip{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;color:#fff;}
  .pchip-P0{background:var(--p0);}
  .pchip-P1{background:var(--p1);}
  .pchip-P2{background:var(--p2);}
  .pchip-P3{background:var(--p3);}
  .todo-meta .meta-text{font-size:11.5px;color:var(--muted);}
  .todo-meta .meta-text.warn{color:var(--warn);font-weight:600;}
  .todo-meta .meta-text.danger{color:var(--danger);font-weight:600;}
  .proj-link{font-size:11.5px;color:var(--accent);background:#FAF0E8;padding:1px 7px;border-radius:5px;}
  .todo-actions{display:flex;gap:4px;flex-shrink:0;}
  .todo-empty{text-align:center;color:var(--muted);font-size:13px;padding:24px;}
  .empty-illu{margin:0 auto 12px;width:110px;height:90px;opacity:.92;}

  /* ===== Inspiration ===== */
  .insp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
  .insp-card{
    background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;
    position:relative;transition:all .15s;
  }
  .insp-card:hover{box-shadow:var(--shadow-lg);border-color:#cbd5e1;}
  .insp-content{font-size:14px;line-height:1.6;color:var(--text);word-break:break-word;white-space:pre-wrap;}
  .insp-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
  .insp-tag{font-size:11px;padding:2px 8px;border-radius:5px;background:var(--primary-light);color:var(--primary-dark);font-weight:500;}
  .insp-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--muted);}
  .insp-del{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:0;transition:all .15s;}
  .insp-card:hover .insp-del{opacity:1;}
  .insp-del:hover{background:var(--danger-bg);color:var(--danger);}
  .insp-del svg{width:14px;height:14px;}

  .tag-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .tag-filter-item{font-size:12px;padding:5px 11px;border-radius:16px;background:#fff;border:1px solid var(--border);color:var(--muted);font-weight:500;min-height:30px;}
  .tag-filter-item:hover{border-color:#cbd5e1;}
  .tag-filter-item.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  /* ===== Project ===== */
  .proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
  .proj-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;border-left:4px solid var(--primary);}
  .proj-card.blocked{border-left-color:var(--danger);}
  .proj-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .proj-name{font-size:15px;font-weight:700;color:var(--text);}
  .proj-stage{font-size:12px;color:var(--accent);background:#FAF0E8;display:inline-block;padding:2px 8px;border-radius:6px;margin-top:4px;font-weight:500;}
  .proj-block{margin-top:10px;padding:8px 10px;background:var(--danger-bg);border-radius:8px;font-size:12.5px;color:#991b1b;display:flex;gap:6px;align-items:flex-start;}
  .proj-block svg{width:14px;height:14px;flex-shrink:0;margin-top:2px;}
  .proj-row{margin-top:10px;font-size:13px;}
  .proj-row .lbl{color:var(--muted);font-size:11.5px;font-weight:600;margin-bottom:2px;}
  .proj-progress{margin-top:12px;}
  .proj-progress-head{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:5px;}
  .progress-bar{height:7px;background:#f1f5f9;border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;transition:width .3s;}
  .proj-todos{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px;}
  .proj-todo-mini{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0;color:var(--muted);}
  .proj-todo-mini .mini-check{width:13px;height:13px;border-radius:3px;border:1.5px solid #cbd5e1;flex-shrink:0;}
  .proj-todo-mini.done{color:var(--success);}
  .proj-todo-mini.done .mini-check{background:var(--success);border-color:var(--success);}
  .proj-todo-mini.done span{text-decoration:line-through;}
  .proj-actions{display:flex;gap:6px;margin-top:12px;}

  /* ===== Review ===== */
  .review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px;}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden;}
  .stat-card .stat-label{font-size:12px;color:var(--muted);font-weight:500;}
  .stat-card .stat-num{font-size:30px;font-weight:700;color:var(--text);margin-top:4px;line-height:1;}
  .stat-card .stat-sub{font-size:11.5px;color:var(--muted);margin-top:5px;}
  .stat-card.accent{border-left:4px solid var(--primary);}
  .stat-card.accent .stat-num{color:var(--primary-dark);}

  .review-charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .chart-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;}
  .chart-card h3{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:7px;}
  .chart-card h3 svg{width:16px;height:16px;color:var(--primary);}
  .chart-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:20px;}
  .chart-illu{margin:0 auto 10px;width:100px;height:70px;opacity:.85;}

  .legend{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .legend-item .lname{flex:1;}
  .legend-item .lval{color:var(--muted);font-weight:600;}

  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px;}
  .bar-row .bname{width:80px;flex-shrink:0;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;height:18px;background:#f1f5f9;border-radius:5px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:5px;transition:width .4s;}
  .bar-row .bval{width:30px;text-align:right;color:var(--muted);font-weight:600;flex-shrink:0;}

  .blocker-list{display:flex;flex-direction:column;gap:8px;}
  .blocker-item{padding:10px 12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;font-size:13px;}
  .blocker-item .b-title{font-weight:600;color:#9a3412;}
  .blocker-item .b-desc{color:#c2410c;margin-top:3px;font-size:12.5px;}

  /* ===== Modal ===== */
  .modal-mask{
    position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;
    display:none;align-items:center;justify-content:center;padding:18px;
    backdrop-filter:blur(2px);
  }
  .modal-mask.show{display:flex;animation:fadein .15s;}
  .modal{
    background:#fff;border-radius:16px;padding:22px;max-width:460px;width:100%;
    box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;
  }
  .modal h3{font-size:17px;font-weight:700;margin-bottom:6px;}
  .modal p{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .modal textarea.input-block{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;min-height:120px;font-family:monospace;font-size:12px;resize:vertical;}

  /* toast */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--text);color:#fff;padding:10px 18px;border-radius:24px;
    font-size:13px;z-index:200;opacity:0;transition:all .3s;box-shadow:var(--shadow-lg);
    max-width:90vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.success{background:var(--success);}
  .toast.error{background:var(--danger);}

  /* ===== Mobile bottom nav ===== */
  .mobile-nav{display:none;}
  .hamburger{display:none;}

  @media(max-width:768px){
    .app-header{padding:12px 14px;gap:10px;flex-wrap:wrap;}
    .header-banner{display:none;}
    .header-title{font-size:16px;}
    .header-sub{display:none;}
    .header-actions .btn{padding:8px 11px;font-size:12.5px;}
    .header-actions .btn span.lbl{display:none;}
    .header-actions .btn{min-height:38px;}

    .layout{padding:12px;gap:0;flex-direction:column;padding-bottom:80px;}
    .sidebar{display:none;}
    .main{width:100%;}

    .section-head h2{font-size:16px;}
    .review-charts{grid-template-columns:1fr;}
    .insp-grid{grid-template-columns:1fr;}
    .proj-grid{grid-template-columns:1fr;}

    .form-field input,.form-field select,.form-field textarea{font-size:16px;}

    .mobile-nav{
      display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;
      background:#fff;border-top:1px solid var(--border);
      padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));
      justify-content:space-around;
    }
    .mobile-nav button{
      flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
      padding:7px 2px;font-size:11px;color:var(--muted);font-weight:500;min-height:50px;
    }
    .mobile-nav button svg{width:20px;height:20px;}
    .mobile-nav button.active{color:var(--primary-dark);}

    .todo-actions{flex-direction:column;gap:3px;}
    .todo-actions .btn-icon{width:30px;height:30px;min-height:30px;}
    .todo-actions .btn-icon svg{width:14px;height:14px;}
    .modal{padding:18px;}
    .btn{min-height:44px;}
  }
  @media(max-width:420px){
    .header-logo .header-title{font-size:15px;}
  }
#appSplash{position:fixed;inset:0;background:linear-gradient(135deg,#FAF9F5 0%,#FAF0E8 100%);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease;}
#appSplash.hide{opacity:0;pointer-events:none;}
.splash-inner{text-align:center;}
.splash-title{font-size:22px;font-weight:700;color:#1A1A1A;margin-top:16px;font-family:Georgia,"Times New Roman","Songti SC",serif;letter-spacing:.5px;}
.splash-sub{font-size:12px;color:#6B6B6B;margin-top:4px;}
/* ===== AI 助手 ===== */
.ai-action-btn{font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--primary-dark);font-weight:600;min-height:30px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;transition:all .15s;}
.ai-action-btn:hover{background:var(--primary-light);border-color:var(--primary);}
.ai-action-btn:disabled{opacity:.6;cursor:wait;}
.ai-action-btn svg{width:13px;height:13px;}
.ai-result{font-size:13.5px;line-height:1.75;color:var(--text);white-space:pre-wrap;word-break:break-word;max-height:55vh;overflow-y:auto;padding:4px 2px;}
.ai-loading-dots{display:inline-flex;gap:4px;align-items:center;}
.ai-loading-dots span{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:aidot 1.2s infinite ease-in-out both;}
.ai-loading-dots span:nth-child(2){animation-delay:.15s;}
.ai-loading-dots span:nth-child(3){animation-delay:.3s;}
@keyframes aidot{0%,80%,100%{opacity:.3;transform:scale(.7);}40%{opacity:1;transform:scale(1);}}
.ai-status{font-size:12px;padding:7px 10px;border-radius:6px;margin-top:8px;display:none;}
.ai-status.show{display:block;}
.ai-status.ok{background:#E8F5EC;color:#2D6A3F;}
.ai-status.err{background:var(--danger-bg);color:var(--danger);}
.modal .ai-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;}
.flow-chart{background:#FAF9F5;border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:14px;overflow-x:auto;}
.flow-chart svg{display:block;margin:0 auto;min-width:220px;}
.attachments{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.att-img{position:relative;width:58px;height:58px;border-radius:8px;overflow:hidden;border:1px solid var(--border);flex-shrink:0;}
.att-img img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block;}
.att-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.att-del:hover{background:rgba(200,85,61,.9);}
.att-file{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:5px 9px;background:var(--primary-light);border-radius:6px;color:var(--primary-dark);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;}
.att-file svg{width:13px;height:13px;flex-shrink:0;}
.att-upload{margin-top:8px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
.att-upload-btn{font-size:11px;padding:5px 10px;border-radius:6px;border:1px dashed var(--border);background:#fff;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
.att-upload-btn:hover{border-color:var(--primary);color:var(--primary-dark);background:var(--primary-light);}
.att-upload-btn svg{width:12px;height:12px;}
.att-upload-hint{font-size:10px;color:var(--muted);}
.att-preview-mask{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;cursor:pointer;}
.att-preview-mask.show{display:flex;}
.att-preview-mask img{max-width:92vw;max-height:88vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5);}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateOffset(days){
  const d = new Date();
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function fmtDate(s){
  if(!s) return '';
  const d = new Date(s+'T00:00:00');
  const today = new Date(todayStr()+'T00:00:00');
  const diff = Math.round((d-today)/86400000);
  if(diff===0) return '今天';
  if(diff===1) return '明天';
  if(diff===-1) return '昨天';
  if(diff>1 && diff<=6){
    return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  }
  if(diff<0) return '逾期'+Math.abs(diff)+'天';
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function fmtDateTime(s){
  const d = new Date(s);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function load(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      data = JSON.parse(raw);
      if(!data.meta) data.meta = {};
    }else{
      data = defaultData();
      save();
    }
  }catch(e){
    data = defaultData();
  }
  // 字段补全
  data.todos.forEach(t=>{
    if(t.postponeCount===undefined) t.postponeCount=0;
    if(t.projectId===undefined) t.projectId=null;
  });
}
function save(){
  try{localStorage.setItem(DB_KEY,JSON.stringify(data));}
  catch(e){toast('保存失败：存储空间不足，建议导出备份后清理','error');}
}

/* ============ 自动顺延：逾期未完成任务挪到今天 ============ */
function autoPostpone(){
  const today = todayStr();
  let changed = false;
  data.todos.forEach(t=>{
    if(!t.completed && t.dueDate && t.dueDate < today){
      t.dueDate = today;
      t.postponeCount = (t.postponeCount||0)+1;
      t.autoPostponed = true;
      changed = true;
    }
  });
  if(changed) save();
}

/* ============ 导航切换 ============ */
function switchSection(name){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('section-'+name).classList.add('active');
  document.querySelectorAll('.nav-item[data-section]').forEach(b=>{
    b.classList.toggle('active', b.dataset.section===name);
  });
  document.querySelectorAll('.mobile-nav button[data-section]').forEach(b=>{
    b.classList.toggle('active', b.dataset.section===name);
  });
  if(name==='review') renderReview();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============ 顶部今天要处理 ============ */
function renderTopAlert(){
  const today = todayStr();

  const blockedProjects = data.projects.filter(p=>p.blocker && p.blocker.trim());
  const box = document.getElementById('topAlert');
  box.classList.toggle('has-issue', overdue.length>0 || blockedProjects.length>0);

  let html = '<div class="top-alert-title"><span class="dot"></span> 今天要处理</div>';
  if(overdue.length===0 && blockedProjects.length===0){
    html += '<div class="top-alert-empty"><svg viewBox="0 0 80 60" width="48" height="36" fill="none"><path d="M40 10 l4.5 9 l10 1 l-7.5 6.5 l2.5 10 l-9.5 -5.5 l-9.5 5.5 l2.5 -10 l-7.5 -6.5 l10 -1 z" fill="#D97757" stroke="#B85842" stroke-width="1.2" stroke-linejoin="round"/><circle cx="14" cy="18" r="1.8" fill="#B89968"/><circle cx="66" cy="20" r="1.8" fill="#B89968"/><circle cx="18" cy="46" r="1.6" fill="#4A7C59"/><circle cx="64" cy="44" r="1.6" fill="#4A7C59"/><line x1="40" y1="2" x2="40" y2="6" stroke="#D97757" stroke-width="1.5" stroke-linecap="round"/></svg> 一切就绪，今天没有逾期或卡点</div>';
  }else{
    html += '<div class="alert-list">';
    overdue.forEach(t=>{
      const proj = t.projectId ? data.projects.find(p=>p.id===t.projectId) : null;
      html += `<div class="alert-item">
        <span class="alert-item-tag">逾期顺延</span>
        <div class="alert-item-text">${escapeHtml(t.title)}${proj?'<span class="sub"> · '+escapeHtml(proj.name)+'</span>':''}<span class="sub"> · 已顺延 ${t.postponeCount} 次</span></div>
        <button class="alert-item-btn" onclick="postponeTodo('${t.id}',1);renderTopAlert();renderTodos();">再延到明天</button>
      </div>`;
    });
    blockedProjects.forEach(p=>{
      const linked = data.todos.filter(t=>t.projectId===p.id && !t.completed).length;
      html += `<div class="alert-item warn">
        <span class="alert-item-tag">项目卡点</span>
        <div class="alert-item-text">${escapeHtml(p.name)}<span class="sub"> · ${escapeHtml(p.blocker)}${linked?' · '+linked+'项关联待办':''}</span></div>
        <button class="alert-item-btn" onclick="switchSection('project')">去处理</button>
      </div>`;
    });
    html += '</div>';
  }
  box.innerHTML = html;

  // nav badges
  const todoOverdue = data.todos.filter(t=>!t.completed && t.autoPostponed).length;
  const tb = document.getElementById('navTodoBadge');
  if(todoOverdue>0){tb.textContent=todoOverdue;tb.style.display='inline-block';tb.style.background='var(--danger)';}
  else{tb.style.display='none';}

  const pb = document.getElementById('navProjBadge');
  const blocked = data.projects.filter(p=>p.blocker && p.blocker.trim()).length;
  if(blocked>0){pb.textContent=blocked;pb.style.display='inline-block';}
  else{pb.style.display='none';}
}

function addTodo(){
  const title = document.getElementById('todoInput').value.trim();
  if(!title){toast('请填写任务内容','error');return;}
  const priority = document.getElementById('todoPriority').value;
  const dueDate = document.getElementById('todoDue').value || todayStr();
  const projectId = document.getElementById('todoProject').value || null;
  data.todos.unshift({
    id:uid(),title,priority,dueDate,completed:false,
    projectId,postponeCount:0,createdAt:Date.now()
  });
  save();
  document.getElementById('todoInput').value='';
  document.getElementById('todoDue').value='';
  renderAll();
  toast('已添加','success');
}

function toggleTodo(id){
  const t = data.todos.find(x=>x.id===id);
  if(!t) return;
  t.completed = !t.completed;
  t.completedDate = t.completed ? Date.now() : null;
  save();
  renderAll();
}

function postponeTodo(id,days){
  const t = data.todos.find(x=>x.id===id);
  if(!t) return;
  t.dueDate = dateOffset(days);
  t.postponeCount = (t.postponeCount||0)+1;
  t.autoPostponed = false;
  save();
  renderAll();
  toast('已顺延到'+fmtDate(t.dueDate),'success');
}

function deleteTodo(id){
  data.todos = data.todos.filter(t=>t.id!==id);
  save();
  renderAll();
  toast('已删除','success');
}

function renderTodos(){
  const today = todayStr();
  const groups = {
    overdue:{label:'逾期顺延',cls:'gtag-overdue',items:[]},
    today:{label:'今天',cls:'gtag-today',items:[]},
    tomorrow:{label:'明天',cls:'gtag-tomorrow',items:[]},
    week:{label:'本周内',cls:'gtag-week',items:[]},
    future:{label:'更远',cls:'gtag-future',items:[]}
  };
  // 未完成按日期分组
  data.todos.filter(t=>!t.completed).forEach(t=>{
    if(t.autoPostponed) groups.overdue.items.push(t);
    else if(t.dueDate<=today) groups.today.items.push(t);
    else if(t.dueDate===dateOffset(1)) groups.tomorrow.items.push(t);
    else if(t.dueDate<=dateOffset(7)) groups.week.items.push(t);
    else groups.future.items.push(t);
  });
  // 排序：组内按优先级+日期
  const pOrder={P0:0,P1:1,P2:2,P3:3};
  Object.values(groups).forEach(g=>g.items.sort((a,b)=>pOrder[a.priority]-pOrder[b.priority] || a.dueDate.localeCompare(b.dueDate)));

  // 已完成（最近7天）
  const done = data.todos.filter(t=>t.completed && t.completedDate && (Date.now()-t.completedDate)<86400000*7)
    .sort((a,b)=>b.completedDate-a.completedDate);

  const container = document.getElementById('todoList');
  let html = '';
  const order=['overdue','today','tomorrow','week','future'];
  order.forEach(k=>{
    const g=groups[k];
    if(g.items.length===0) return;
    html += `<div class="todo-group">
      <div class="todo-group-head"><span class="gtag ${g.cls}">${g.label}</span><span class="gcount">${g.items.length} 项</span></div>`;
    g.items.forEach(t=>{
      const proj = t.projectId ? data.projects.find(p=>p.id===t.projectId) : null;
      const postInfo = t.postponeCount>0 ? `<span class="meta-text ${t.autoPostponed?'warn':''}">已顺延${t.postponeCount}次</span>` : '';
      html += `<div class="todo-item ${t.autoPostponed?'postponed':''}">
        <button class="check-btn" onclick="toggleTodo('${t.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="todo-main">
          <div class="todo-title">${escapeHtml(t.title)}</div>
          <div class="todo-meta">
            <span class="pchip pchip-${t.priority}">${t.priority}</span>
            <span class="meta-text">${fmtDate(t.dueDate)}</span>
            ${postInfo}
            ${proj?`<span class="proj-link">${escapeHtml(proj.name)}</span>`:''}
          </div>
        </div>
        <div class="todo-actions">
          <button class="btn-icon btn-ghost" title="AI 拆解" onclick="splitTodo('${t.id}')" id="aiTodo-${t.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L9 9H2l5.5 4-2 7L12 16l6.5 4-2-7L22 9h-7z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn-icon btn-ghost" title="顺延到明天" onclick="postponeTodo('${t.id}',1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn-icon btn-ghost" title="删除" onclick="deleteTodo('${t.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        ${renderAttachments('todo',t.id)}
        ${attUploadHtml('todo',t.id)}
      </div>`;
    });
    html += '</div>';
  });

  if(done.length>0){
    html += `<div class="todo-group">
      <div class="todo-group-head"><span class="gtag" style="background:var(--success);color:#fff;">最近完成</span><span class="gcount">${done.length} 项</span></div>`;
    done.forEach(t=>{
      const proj = t.projectId ? data.projects.find(p=>p.id===t.projectId) : null;
      html += `<div class="todo-item done">
        <button class="check-btn" onclick="toggleTodo('${t.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="todo-main">
          <div class="todo-title">${escapeHtml(t.title)}</div>
          <div class="todo-meta">
            <span class="pchip pchip-${t.priority}" style="opacity:.7;">${t.priority}</span>
            ${proj?`<span class="proj-link">${escapeHtml(proj.name)}</span>`:''}
            <span class="meta-text">完成于 ${fmtDateTime(t.completedDate)}</span>
          </div>
        </div>
      </div>`;
    });
    html += '</div>';
  }

  if(html===''){
    html = '<div class="card todo-empty"><div class="empty-illu"><svg viewBox="0 0 120 100" width="120" height="100" fill="none"><rect x="30" y="20" width="60" height="68" rx="8" fill="#FAF0E8" stroke="#D97757" stroke-width="2"/><rect x="46" y="14" width="28" height="12" rx="4" fill="#D97757"/><circle cx="42" cy="42" r="3.5" fill="#B89968"/><line x1="50" y1="42" x2="78" y2="42" stroke="#B89968" stroke-width="2.5" stroke-linecap="round"/><circle cx="42" cy="58" r="3.5" fill="#4A7C59"/><path d="M50 58 l4 4 l8 -10" stroke="#4A7C59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="42" cy="74" r="3.5" fill="#B89968"/><line x1="50" y1="74" x2="70" y2="74" stroke="#B89968" stroke-width="2.5" stroke-linecap="round"/></svg></div>还没有任务，添加第一条待办开始吧 ✎</div>';
  }
  container.innerHTML = html;
}

  if(!content){toast('请输入内容','error');return;}
  const tagsRaw = document.getElementById('inspTags').value.trim();
  const tags = tagsRaw ? tagsRaw.split(/[,，、\s]+/).filter(Boolean) : [];
  data.inspirations.unshift({id:uid(),content,tags,createdAt:Date.now()});
  save();
  document.getElementById('inspInput').value='';
  document.getElementById('inspTags').value='';
  renderAll();
  toast('已记下','success');
}

function deleteInspiration(id){
  data.inspirations = data.inspirations.filter(i=>i.id!==id);
  save();
  renderAll();
  toast('已删除','success');
}

  // tag filter
  const tagSet = {};

  let fhtml = `<button class="tag-filter-item ${!currentTagFilter?'active':''}" onclick="setTagFilter(null)">全部 ${data.inspirations.length}</button>`;

    fhtml += `<button class="tag-filter-item ${currentTagFilter===t?'active':''}" onclick="setTagFilter('${escapeAttr(t)}')">${escapeHtml(t)} ${tagSet[t]}</button>`;
  });
  filterBox.innerHTML = fhtml;

  const list = document.getElementById('inspList');

    list.innerHTML = '<div class="card todo-empty" style="grid-column:1/-1;"><div class="empty-illu"><svg viewBox="0 0 120 100" width="120" height="100" fill="none"><line x1="60" y1="8" x2="60" y2="18" stroke="#D97757" stroke-width="2.5" stroke-linecap="round"/><line x1="34" y1="18" x2="40" y2="26" stroke="#D97757" stroke-width="2.5" stroke-linecap="round"/><line x1="86" y1="18" x2="80" y2="26" stroke="#D97757" stroke-width="2.5" stroke-linecap="round"/><line x1="20" y1="44" x2="30" y2="44" stroke="#D97757" stroke-width="2.5" stroke-linecap="round"/><line x1="90" y1="44" x2="100" y2="44" stroke="#D97757" stroke-width="2.5" stroke-linecap="round"/><path d="M60 24 a20 20 0 0 1 13 35 l0 8 l-26 0 l0 -8 a20 20 0 0 1 13 -35 z" fill="#FAF0E8" stroke="#D97757" stroke-width="2"/><line x1="49" y1="72" x2="71" y2="72" stroke="#B85842" stroke-width="2.5" stroke-linecap="round"/><line x1="51" y1="80" x2="69" y2="80" stroke="#B85842" stroke-width="2.5" stroke-linecap="round"/><path d="M53 52 l4 4 l8 -10" stroke="#D97757" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>还没有灵感，随手记下第一个想法吧 ✎</div>';

    <div class="form-field" style="margin-bottom:10px;"><label>当前阶段</label><input type="text" id="pStage" value="${p?escapeAttr(p.stage):''}" placeholder="例如：开发中"></div>
    <div class="form-field" style="margin-bottom:10px;"><label>下一步做什么</label><input type="text" id="pNext" value="${p?escapeAttr(p.nextStep):''}" placeholder="例如：周三前端联调"></div>
    <div class="form-field" style="margin-bottom:10px;"><label>卡在哪里（留空表示无卡点）</label><input type="text" id="pBlock" value="${p?escapeAttr(p.blocker||''):''}" placeholder="例如：等设计稿确认"></div>

      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveProject(${p?`'${p.id}'`:'null'})">保存</button>
    </div>
  `);

function saveProject(id){
  const name = document.getElementById('pName').value.trim();
  if(!name){toast('请填写项目名称','error');return;}
  const stage = document.getElementById('pStage').value.trim();
  const nextStep = document.getElementById('pNext').value.trim();
  const blocker = document.getElementById('pBlock').value.trim();
  if(id){
    const p = data.projects.find(x=>x.id===id);
    if(p){p.name=name;p.stage=stage;p.nextStep=nextStep;p.blocker=blocker;}
  }else{
    data.projects.unshift({id:uid(),name,stage,nextStep,blocker,createdAt:Date.now()});
  }
  save();
  closeModal();
  renderAll();
  toast('已保存','success');
}

function deleteProject(id){
  closeModal();
  showConfirm('删除项目','删除后该项目下关联的待办不会被删除，但会失去项目关联。确认删除？',()=>{
    // 解除待办关联
    data.todos.forEach(t=>{if(t.projectId===id) t.projectId=null;});
    data.projects = data.projects.filter(p=>p.id!==id);
    save();
    renderAll();
    toast('已删除','success');
  });
}

function renderProjects(){

function renderReview(){
  const now = new Date();
  const dayOfWeek = (now.getDay()+6)%7; // 周一=0
  const monday = new Date(now);
  monday.setDate(now.getDate()-dayOfWeek);
  monday.setHours(0,0,0,0);
  const mondayStr = monday.getFullYear()+'-'+String(monday.getMonth()+1).padStart(2,'0')+'-'+String(monday.getDate()).padStart(2,'0');

  const weekDone = data.todos.filter(t=>t.completed && t.completedDate && t.completedDate>=monday.getTime());
  const weekDoneCount = weekDone.length;
  const todayCount = weekDone.filter(t=>{
    const d=new Date(t.completedDate);return d.toDateString()===now.toDateString();
  }).length;

  // 优先级分布
  const pCount={P0:0,P1:0,P2:0,P3:0};
  weekDone.forEach(t=>pCount[t.priority]=(pCount[t.priority]||0)+1);

    dailyLabels.push(['周一','周二','周三','周四','周五','周六','周日'][i]);

  // 卡点汇总

    html += '<div class="chart-empty" style="color:var(--success);">当前没有卡点，状态良好</div>';

    blockers.forEach(p=>{
      const linked = data.todos.filter(t=>t.projectId===p.id && !t.completed).length;
      html += `<div class="blocker-item"><div class="b-title">${escapeHtml(p.name)}${linked?` · ${linked}项待办受影响`:''}</div><div class="b-desc">${escapeHtml(p.blocker)}</div></div>`;

  document.getElementById('reviewContent').innerHTML = html;
}

/* ============ 内联SVG图表 ============ */
function drawPie(data,colors,labels){
  const total = Object.values(data).reduce((a,b)=>a+b,0);
  const cx=70,cy=70,r=55;
  if(total===0) return '<svg width="140" height="140"></svg>';
  let acc=-Math.PI/2;
  let paths='';
  const legend=[];
  let allColors=colors,allLabels=labels;
  const keys=['P0','P1','P2','P3'];
  keys.forEach((k,i)=>{
    const v=data[k]||0;
    if(v===0) return;
    const angle = v/total*Math.PI*2;
    const start=acc, end=acc+angle;
    const x1=cx+r*Math.cos(start), y1=cy+r*Math.sin(start);
    const x2=cx+r*Math.cos(end), y2=cy+r*Math.sin(end);
    const large = angle>Math.PI?1:0;
    paths += `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${colors[i]}" stroke="#fff" stroke-width="2"/>`;
    acc=end;
    legend.push({name:labels[i],val:v,color:colors[i]});
  });
  return `<svg width="140" height="140" viewBox="0 0 140 140" style="flex-shrink:0;">${paths}<circle cx="${cx}" cy="${cy}" r="22" fill="#fff"/><text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A1A">${total}</text><text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="9" fill="#6B6B6B">总数</text></svg>
    <div class="legend" style="flex:1;min-width:120px;">${legend.map(l=>`<div class="legend-item"><span class="legend-dot" style="background:${l.color};"></span><span class="lname">${l.name}</span><span class="lval">${l.val} 件 · ${Math.round(l.val/total*100)}%</span></div>`).join('')}</div>`;
}

function drawLine(labels,values){
  const W=560,H=180,padL=36,padR=16,padT=20,padB=30;
  const maxV=Math.max(1,...values);
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const step = labels.length>1 ? innerW/(labels.length-1) : 0;
  const pts = values.map((v,i)=>[padL+i*step, padT+innerH-(v/maxV)*innerH]);
  const linePath = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L ${padL+(labels.length-1)*step} ${padT+innerH} L ${padL} ${padT+innerH} Z`;
  const gridLines=[0,0.5,1].map(f=>{
    const y=padT+innerH-f*innerH;
    return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#f1f5f9" stroke-width="1"/>`;
  }).join('');
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#D97757" stroke="#fff" stroke-width="2"/>`).join('');
  const vlabels = pts.map((p,i)=>`<text x="${p[0].toFixed(1)}" y="${(p[1]-10).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="#B85842">${values[i]}</text>`).join('');
  const xlabels = labels.map((l,i)=>`<text x="${(padL+i*step).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#6B6B6B">${l}</text>`).join('');
  const ylabels = [0,Math.ceil(maxV/2),maxV].map((v,f)=>{
    const y=padT+innerH-f*innerH;
    return `<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="#94a3b8">${Math.round(v)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:560px;">${gridLines}${ylabels}<path d="${areaPath}" fill="#D97757" opacity="0.1"/><path d="${linePath}" fill="none" stroke="#D97757" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${vlabels}${xlabels}</svg>`;
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url;
  a.download = '办公工作台备份_'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
  data.meta.backupReminderShown = true;
  save();

function importJSON(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const imported = JSON.parse(e.target.result);
      if(!imported.todos || !imported.inspirations || !imported.projects){
        throw new Error('文件格式不正确');
      }
      showConfirm('导入数据','导入将覆盖当前所有数据，且不可恢复。建议先导出当前数据备份。确认导入？',()=>{
        data = imported;
        if(!data.meta) data.meta={};
        data.meta.backupReminderShown = false;
        save();
        renderAll();
        toast('已导入 '+data.todos.length+' 条待办 + '+data.inspirations.length+' 条灵感 + '+data.projects.length+' 个项目','success');
      });
    }catch(err){
      toast('导入失败：'+err.message,'error');
    }
    event.target.value='';
  };
  reader.readAsText(file);
}

function restoreSample(){
  const d = defaultData();
  // 用新id避免冲突
  const idMap={};
  d.projects.forEach(p=>{const nid=uid();idMap[p.id]=nid;p.id=nid;p.isSample=true;});
  d.todos.forEach(t=>{
    if(t.projectId && idMap[t.projectId]) t.projectId=idMap[t.projectId];
    t.id=uid();t.isSample=true;
  });
  d.inspirations.forEach(i=>{i.id=uid();i.isSample=true;});
  data.projects = d.projects.concat(data.projects);
  data.todos = d.todos.concat(data.todos);
  data.inspirations = d.inspirations.concat(data.inspirations);
  save();
  renderAll();
  toast('已恢复示例数据','success');
}

function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){return escapeHtml(s).replace(/'/g,'&#39;');}

  '<div class="ai-status" id="aiStatus"></div>'+
  '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-ghost" onclick="testAIConn()">测试连接</button><button class="btn btn-primary" onclick="saveAIConfigAndClose()">保存</button></div>'+
  '<div class="ai-note">官方 DeepSeek：base https://api.deepseek.com/v1，模型 deepseek-chat / deepseek-reasoner<br>中转 API：填中转 base + 对应模型名（如 deepseek-v4-flash）<br>注意：中转服务器需允许 CORS（Access-Control-Allow-Origin 含 github.io），否则浏览器直调会失败<br>key 在 devtools 可见，单用户自用可接受，勿在公共电脑保存。</div>');
}

async function testAIConn(){
  const base=document.getElementById('aiBase').value.trim()||'https://api.deepseek.com/v1';
  const key=document.getElementById('aiKey').value.trim();
  const model=document.getElementById('aiModel').value.trim()||'deepseek-v4-flash';
  const st=document.getElementById('aiStatus');
  if(!key){st.className='ai-status err show';st.textContent='请先填 key';return;}
  st.className='ai-status show';st.textContent='测试中…';
  try{
    const r=await callDeepSeek([{role:'user',content:'回复 OK'}],{base,key,model});
    st.className='ai-status ok show';st.textContent='✓ 连接成功：'+(r||'').slice(0,30);
  }catch(e){st.className='ai-status err show';st.textContent='✗ '+e.message;}
}
async function callDeepSeek(messages,overrideCfg){
  const cfg=overrideCfg||loadAIConfig();
  if(!cfg.key) throw new Error('未配置 API key，请先在「AI 设置」填写');
  const base=(cfg.base||'https://api.deepseek.com/v1').replace(/\/+$/,'');
  const model=cfg.model||'deepseek-v4-flash';
  const r=await fetch(base+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
    body:JSON.stringify({model:model,messages:messages,stream:false,temperature:0.7})
  });
  if(!r.ok){let t='';try{t=await r.text();}catch(e){}throw new Error('API '+r.status+': '+t.slice(0,150));}
  const d=await r.json();
  return (d.choices&&d.choices[0]&&d.choices[0].message)?d.choices[0].message.content:'';
}
function showAIResult(title,htmlContent,actions){
  let actionsHtml='';
  if(actions&&actions.length) actionsHtml='<div class="modal-actions">'+actions.map(function(a){return '<button class="btn '+(a.cls||'btn-ghost')+'" onclick="'+a.onclick+'()">'+a.label+'</button>';}).join('')+'</div>';
  showModal('<h3>'+title+'</h3><div class="ai-result">'+htmlContent+'</div>'+actionsHtml+'<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">关闭</button></div>');
}
function aiLoadingHtml(){return '<span class="ai-loading-dots"><span></span><span></span><span></span></span>';}
async function runAI(title,prompt,btnId,onDone){
  const btn=btnId?document.getElementById(btnId):null;
  if(btn){btn.disabled=true;btn.setAttribute('data-orig',btn.innerHTML);btn.innerHTML=aiLoadingHtml()+' 思考中';}
  showModal('<h3>'+title+'</h3><div class="ai-result" style="text-align:center;padding:30px;">'+aiLoadingHtml()+'<div style="margin-top:10px;color:var(--muted);font-size:12px;">AI 思考中…</div></div>');
  try{
    const txt=await callDeepSeek([{role:'user',content:prompt}]);
    const html=escapeHtml(txt).replace(/\n/g,'<br>');
    if(onDone) onDone(txt,html); else showAIResult(title,html);
  }catch(e){
    showAIResult(title+' · 出错','<span style="color:var(--danger);">'+escapeHtml(e.message)+'</span><br><br>如果是 key 问题，到「AI 设置」检查；如果是网络问题稍后重试。');
  }finally{
    if(btn&&btn.getAttribute('data-orig')){btn.disabled=false;btn.innerHTML=btn.getAttribute('data-orig');btn.removeAttribute('data-orig');}
  }
}

/* 复盘 AI 洞察 */
async function reviewInsight(){
  const now=new Date();
  const dow=(now.getDay()+6)%7;
  const monday=new Date(now);monday.setDate(now.getDate()-dow);monday.setHours(0,0,0,0);
  const weekDone=data.todos.filter(function(t){return t.completed&&t.completedDate&&t.completedDate>=monday.getTime();});
  const pCount={P0:0,P1:0,P2:0,P3:0};
  weekDone.forEach(function(t){pCount[t.priority]=(pCount[t.priority]||0)+1;});
  const projEffort={};
  weekDone.forEach(function(t){if(t.projectId){var p=data.projects.find(function(x){return x.id===t.projectId;});if(p)projEffort[p.name]=(projEffort[p.name]||0)+1;}});
  var blockers=data.projects.filter(function(p){return p.blocker&&p.blocker.trim();}).map(function(p){return p.name+'：'+p.blocker;}).join('；')||'无';
  var pending=data.todos.filter(function(t){return !t.completed;}).length;
  var summary='本周完成 '+weekDone.length+' 件（P0:'+pCount.P0+'，P1:'+pCount.P1+'，P2:'+pCount.P2+'，P3:'+pCount.P3+'）。\n精力分布：'+Object.keys(projEffort).map(function(k){return k+projEffort[k]+'件';}).join('，')+'；独立任务'+weekDone.filter(function(t){return !t.projectId;}).length+'件。\n当前卡点：'+blockers+'\n待办剩余：'+pending+'件。';
  runAI('复盘洞察','你是资深项目管理顾问。根据以下本周复盘数据，给出 3-5 条洞察：① 做得好的 ② 需要改进的 ③ 下周建议聚焦什么。简短分点，400字以内。\n\n'+summary,'aiReviewBtn',function(txt,html){
    showAIResult('复盘洞察',html);
  });
}

async function runBrainstorm(){
  const topic=document.getElementById('bsTopic').value.trim();
  if(!topic){toast('请输入主题','error');return;}
  closeModal();
  window._aiCtx={type:'brainstorm',topic:topic};
  runAI('头脑风暴：'+topic,'你是创意顾问+流程设计专家。围绕主题「'+topic+'」做头脑风暴，严格按以下格式输出，不要额外解释：\n\n【思路】\n- 想法1\n- 想法2\n- 想法3\n（3-5条发散想法）\n\n【流程步骤】\n步骤1: 内容\n步骤2: 内容\n步骤3: 内容\n（3-6步可执行流程）',null,function(txt,html){
    window._aiResult=txt;
    var steps=[];
    var m=txt.match(/【流程步骤】([\s\S]*?)$/);
    if(m){
      steps=m[1].split('\n').map(function(l){return l.replace(/^步骤\d+\s*[:：]\s*/,'').trim();}).filter(function(l){return l.length>0;});
    }
    var flowHtml='';
    if(steps.length){flowHtml='<div class="flow-chart">'+renderFlowChart(steps)+'</div>';}
    showAIResult('头脑风暴：'+topic,html+flowHtml,[{label:'存为灵感',cls:'btn-primary',onclick:'saveBrainstormAsInsp'}]);
  });
}
function renderFlowChart(steps){
  var n=steps.length;
  if(!n) return '';
  var w=260,boxH=40,gap=14,h=n*(boxH+gap)+6;
  var cx=w/2;
  var svg='<svg viewBox="0 0 '+w+' '+h+'" style="max-width:100%;height:auto;">';
  for(var i=0;i<n;i++){
    var y=i*(boxH+gap)+5;
    var txt=escapeHtml(steps[i].length>16?steps[i].slice(0,15)+'…':steps[i]);
    svg+='<rect x="20" y="'+y+'" width="'+(w-40)+'" height="'+boxH+'" rx="8" fill="#FAF0E8" stroke="#D97757" stroke-width="1.5"/>';
    svg+='<text x="'+cx+'" y="'+(y+boxH/2+5)+'" text-anchor="middle" font-size="12" fill="#1A1A1A" font-weight="500">'+txt+'</text>';
    if(i<n-1){
      var ay=y+boxH,by=y+boxH+gap;
      svg+='<line x1="'+cx+'" y1="'+ay+'" x2="'+cx+'" y2="'+by+'" stroke="#D97757" stroke-width="1.5" stroke-linecap="round"/>';
      svg+='<path d="M'+(cx-4)+' '+(by-4)+' L'+cx+' '+by+' L'+(cx+4)+' '+(by-4)+'" fill="none" stroke="#D97757" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
    }
  }
  svg+='</svg>';
  return svg;
}
function saveBrainstormAsInsp(){
  const ctx=window._aiCtx;
  const txt=window._aiResult||'';
  if(!ctx){closeModal();return;}
  data.inspirations.unshift({id:uid(),content:'【头脑风暴·'+ctx.topic+'】\n'+txt,tags:['头脑风暴'],createdAt:Date.now()});
  save();renderAll();closeModal();toast('已存为灵感','success');
}

/* ============ 附件（图片/文件）上传 ============ */
function compressImage(file, cb){
  if(!file.type.startsWith('image/')){cb(null);return;}
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height,maxW=800;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      try{c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.72));}catch(e){cb(null);}
    };
    img.onerror=function(){cb(null);};
    img.src=reader.result;
  };
  reader.onerror=function(){cb(null);};
  reader.readAsDataURL(file);
}
function readFileBase64(file, cb){
  var reader=new FileReader();
  reader.onload=function(){cb(reader.result);};
  reader.onerror=function(){cb(null);};
  reader.readAsDataURL(file);
}
function findRecord(type,id){
  var arr=type==='todo'?data.todos:(type==='insp'?data.inspirations:data.projects);
  return arr.find(function(r){return r.id===id;});
}
async function addAttachment(type,id,input){
  var files=input.files;if(!files||!files.length)return;
  var rec=findRecord(type,id);if(!rec){input.value='';return;}
  if(!rec.attachments) rec.attachments=[];
  var added=0;
  for(var i=0;i<files.length;i++){
    var f=files[i];
    if(f.type.startsWith('image/')){
      await new Promise(function(res){
        compressImage(f,function(dataUrl){
          if(dataUrl){
            if(rec.attachments.filter(function(a){return a.type==='image';}).length>=9){toast('图片最多 9 张','error');res();return;}
            rec.attachments.push({id:uid(),type:'image',name:f.name,dataUrl:dataUrl,size:Math.round(dataUrl.length*0.75)});
            added++;
          }
          res();
        });
      });
    }else{
      await new Promise(function(res){
        readFileBase64(f,function(dataUrl){
          if(dataUrl){
            if(f.size>500*1024){toast(f.name+' 超 500KB，建议存网盘链接','error');res();return;}
            if(rec.attachments.filter(function(a){return a.type==='file';}).length>=3){toast('文件最多 3 个','error');res();return;}
            rec.attachments.push({id:uid(),type:'file',name:f.name,dataUrl:dataUrl,size:f.size});
            added++;
          }
          res();
        });
      });
    }
  }
  input.value='';
  save();
  var totalSize=JSON.stringify(data).length;
  if(totalSize>4*1024*1024){toast('存储已超 4MB，建议导出备份并清理大文件','error');}
  renderAll();
  if(added>0) toast('已添加 '+added+' 个附件','success');
}
function deleteAttachment(type,id,attId){
  var rec=findRecord(type,id);
  if(!rec||!rec.attachments)return;
  rec.attachments=rec.attachments.filter(function(a){return a.id!==attId;});
  save();renderAll();
}
function renderAttachments(type,id){
  var rec=findRecord(type,id);
  if(!rec||!rec.attachments||!rec.attachments.length)return '';
  var html='<div class="attachments">';
  rec.attachments.forEach(function(a){
    if(a.type==='image'){
      html+='<div class="att-img"><img src="'+a.dataUrl+'" onclick="previewImage(this)"><div class="att-del" onclick="deleteAttachment(\''+type+'\',\''+id+'\',\''+a.id+'\')">×</div></div>';
    }else{
      html+='<a class="att-file" href="'+a.dataUrl+'" download="'+escapeAttr(a.name)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z M13 2v7h7" stroke-linecap="round" stroke-linejoin="round"/></svg>'+escapeHtml(a.name)+'</a><div class="att-del" style="position:relative;display:inline-flex;background:transparent;color:var(--danger);" onclick="deleteAttachment(\''+type+'\',\''+id+'\',\''+a.id+'\')">×</div>';
    }
  });
  html+='</div>';
  return html;
}
function attUploadHtml(type,id){
  return '<div class="att-upload"><input type="file" id="att-input-'+type+'-'+id+'" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip,.ppt,.pptx,.csv" multiple style="display:none" onchange="addAttachment(\''+type+'\',\''+id+'\',this)"><button class="att-upload-btn" onclick="document.getElementById(\'att-input-'+type+'-'+id+'\').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke-linecap="round" stroke-linejoin="round"/></svg>图片/文件</button><span class="att-upload-hint">图片压缩800px·最多9张；文件≤500KB·最多3个</span></div>';
}
